<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refined IPO Valuation Health Checker</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-input: #1f2b48;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #3b82f6;
            --good: #10b981;
            --bad: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .calc-container {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .toggle-container {
            display: flex;
            background-color: var(--bg-main);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Meter System */
        .meter-box {
            height: 6px;
            background-color: var(--bg-main);
            border-radius: 3px;
            margin: 24px 0 12px 0;
            overflow: hidden;
            position: relative;
        }

        .meter-bar {
            height: 100%;
            width: 50%;
            background-color: var(--good);
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
        }

        .result-panel {
            background-color: var(--bg-main);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .verdict-badge {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            display: inline-block;
        }

        .feedback-text {
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-primary);
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="header">
            <h1>IPO Valuation Checker</h1>
            <p class="subtitle">Bhai Guide: Smart Multi-Metric Analytics</p>
        </div>

        <!-- Metric Switcher Toggle -->
        <div class="toggle-container">
            <button class="toggle-btn active" onclick="switchMetric('PS')">Loss-Making Startup (P/S)</button>
            <button class="toggle-btn" onclick="switchMetric('PE')">Profitable Company (P/E)</button>
        </div>

        <div class="input-group">
            <label id="metricLabel" for="metricInput">Price to Sales (P/S) Ratio</label>
            <div class="input-wrapper">
                <input type="number" id="metricInput" value="10.7" step="0.1" oninput="runAnalysis()">
            </div>
        </div>

        <div class="input-group">
            <label for="growthInput">Expected Revenue/Profit Growth (%)</label>
            <div class="input-wrapper">
                <input type="number" id="growthInput" value="11.5" step="0.1" oninput="runAnalysis()">
            </div>
        </div>

        <!-- Visual Health Meter -->
        <div class="meter-box">
            <div id="healthMeter" class="meter-bar"></div>
        </div>

        <div class="result-panel">
            <div class="result-title">Analysis Verdict</div>
            <div id="verdictBadge" class="verdict-badge">Good 👍</div>
            <p id="feedbackText" class="feedback-text">Loading analysis...</p>
        </div>
    </div>

    <script>
        let currentMode = 'PS'; // default mode

        function switchMetric(mode) {
            currentMode = mode;
            const buttons = document.querySelectorAll('.toggle-btn');
            const label = document.getElementById('metricLabel');
            const input = document.getElementById('metricInput');

            if (mode === 'PS') {
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
                label.innerText = "Price to Sales (P/S) Ratio";
                input.value = "10.7";
            } else {
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
                label.innerText = "Price to Earnings (P/E) Ratio";
                input.value = "25.0";
            }
            runAnalysis();
        }

        function runAnalysis() {
            const metricValue = parseFloat(document.getElementById('metricInput').value) || 0;
            const growthRate = parseFloat(document.getElementById('growthInput').value) || 0;
            
            const meter = document.getElementById('healthMeter');
            const verdict = document.getElementById('verdictBadge');
            const feedback = document.getElementById('feedbackText');

            let status = 'GOOD'; // GOOD, AVEREAGE, BAD
            let message = '';
            let meterWidth = 100;

            if (currentMode === 'PS') {
                // P/S Multiplier Logic
                if (metricValue > 25 && growthRate < 20) {
                    status = 'BAD';
                    meterWidth = 25;
                    message = "🚨 **Extremely Overvalued!** High risk territory like Paytm (2021). The sales premium doesn't back the growth speed.";
                } else if (metricValue > 15) {
                    status = 'AVERAGE';
                    meterWidth = 55;
                    message = "⚠️ **Premium Pricing!** A bit expensive, but if growth triggers past 25% organically, it can stabilize.";
                } else {
                    status = 'GOOD';
                    meterWidth = 90;
                    message = "✨ **Disciplined Pricing!** P/S is under control (Safe bracket like PhonePe's updated strategy). Fair deal for retail buyers.";
                }
            } else {
                // P/E Valuation Logic
                if (metricValue > 60 && growthRate < 15) {
                    status = 'BAD';
                    meterWidth = 15;
                    message = "🚨 **Insane PE Premium!** Paying too much per Rupee of profit for sluggish single-digit or low double-digit growth.";
                } else if (metricValue > 35) {
                    status = 'AVERAGE';
                    meterWidth = 60;
                    message = "⚠️ **Fairly Valued to High.** Normal for popular sector leaders, but leaves slim headroom for instant bumper listing gains.";
                } else {
                    status = 'GOOD';
                    meterWidth = 95;
                    message = "👍 **Attractive P/E Value!** Comfortably matches standard stock industry averages. Great room for compound investors.";
                }
            }

            // Apply Visual Render updates
            meter.style.width = meterWidth + '%';
            
            if (status === 'GOOD') {
                verdict.innerText = "Good 👍";
                verdict.style.color = "var(--good)";
                meter.style.backgroundColor = "var(--good)";
            } else if (status === 'AVERAGE') {
                verdict.innerText = "Average ⚖️";
                verdict.style.color = "var(--warning)";
                meter.style.backgroundColor = "var(--warning)";
            } else {
                verdict.innerText = "Bad 👎";
                verdict.style.color = "var(--bad)";
